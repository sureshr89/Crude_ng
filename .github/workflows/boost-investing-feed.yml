name: Boost Investing.com news feed

on:
  push:
    paths:
      - ".github/workflows/boost-investing-feed.yml"
      - ".github/INVESTING_FEED_UPDATE"

permissions:
  contents: write

concurrency:
  group: investing-feed-update
  cancel-in-progress: true

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Investing.com news ingestion
        run: |
          git config pull.rebase true
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path
          p = Path("app.py")
          s = p.read_text()

          s = s.replace("TOP_NEWS = 15", "TOP_NEWS = 30", 1)

          old_build = '''    for name, domain in TARGET_WEBSITES.items():
        feeds[f"{name} (web)"] = google_news_url(query, domain)
    feeds.update(DIRECT_FEEDS)
    return feeds
'''
          new_build = '''    for name, domain in TARGET_WEBSITES.items():
        feeds[f"{name} (web)"] = google_news_url(query, domain)
    feeds.update(DIRECT_FEEDS)

    # Dedicated fast Investing.com commodity searches in addition to the 38-source network.
    investing_queries = {
        "Investing.com Crude Fast": '"crude oil" OR Brent OR WTI OR "oil prices" OR "oil supply" OR Hormuz',
        "Investing.com Gas Fast": '"natural gas" OR LNG OR "gas prices" OR "gas supply" OR "gas storage" OR pipeline',
        "Investing.com Energy Fast": 'Iran OR Gulf OR refinery OR tanker OR sanctions OR OPEC OR "energy infrastructure"',
    }
    for name, q in investing_queries.items():
        feeds[name] = google_news_url(q, "investing.com")
    return feeds
'''
          if old_build in s:
              s = s.replace(old_build, new_build, 1)

          old_date = '''def parse_date(entry):
    for key in ("published", "updated"):
        value = getattr(entry, key, None)
        if value:
            try:
                return parsedate_to_datetime(value).astimezone(timezone.utc)
            except Exception:
                pass
    return None
'''
          new_date = '''def parse_date(entry):
    for key in ("published", "updated"):
        value = getattr(entry, key, None)
        if value:
            try:
                return parsedate_to_datetime(value).astimezone(timezone.utc)
            except Exception:
                pass
    for key in ("published_parsed", "updated_parsed"):
        value = getattr(entry, key, None)
        if value:
            try:
                return datetime(*value[:6], tzinfo=timezone.utc)
            except Exception:
                pass
    return None
'''
          if old_date in s:
              s = s.replace(old_date, new_date, 1)

          s = s.replace("def fetch_one(source, url, max_entries=35):", "def fetch_one(source, url, max_entries=75):", 1)
          s = s.replace("def fetch(feeds, max_entries=35):", "def fetch(feeds, max_entries=75):", 1)

          # Ensure the direct Investing.com feeds exist even if a previous partial update is absent.
          if '"Investing.com Commodities": "https://www.investing.com/rss/news_11.rss"' not in s:
              marker = '    "CNBC": "https://www.cnbc.com/id/100003114/device/rss/rss.html",\n'
              insert = marker + '    "Investing.com Commodities": "https://www.investing.com/rss/news_11.rss",\n    "Investing.com Latest": "https://www.investing.com/rss/news_1063.rss",\n    "Investing.com India Commodities": "https://in.investing.com/rss/news_11.rss",\n'
              s = s.replace(marker, insert, 1)

          p.write_text(s)
          PY

          python -m py_compile app.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m "Improve Investing.com commodity news capture"
          git push origin main
