name: Boost Investing.com news feed

on:
  push:
    paths:
      - ".github/workflows/boost-investing-feed.yml"
      - ".github/INVESTING_FEED_UPDATE"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update direct Investing.com feeds
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app.py")
          s = p.read_text()
          old = '    "Investing.com": "https://www.investing.com/rss/news_14.rss",\n'
          new = '''    # Investing.com direct RSS: fast commodity news + broad breaking news.\n    "Investing.com Commodities": "https://www.investing.com/rss/news_11.rss",\n    "Investing.com Latest": "https://www.investing.com/rss/news_1063.rss",\n    "Investing.com India Commodities": "https://in.investing.com/rss/news_11.rss",\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif '"Investing.com Commodities": "https://www.investing.com/rss/news_11.rss"' not in s:
              raise SystemExit("Expected Investing.com feed line not found")
          s = s.replace('"Investing.com": 0.85,', '"Investing.com": 0.85, "Investing.com Commodities": 1.05, "Investing.com Latest": 0.90, "Investing.com India Commodities": 0.90,', 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m "Use direct Investing.com commodity RSS feeds"
          git push
